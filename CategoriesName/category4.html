<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha</title>
    <link rel="stylesheet" href="category.css">
</head>
<body>
    <h3>Controllers</h3>
    <div class="brand-products">
        <div class="product-card-link" onclick="openDetail('Xbox Wireless Controller', '59$', '../assets/Category4/controller1.png', 'Experience the modernized design of the Xbox Wireless Controller, featuring sculpted surfaces and refined geometry for enhanced comfort during gameplay.', ['Textured Grip on Triggers & Bumpers: Maintains a secure hold during intense gaming sessions.', 'Hybrid D-Pad: Accurate yet familiar input for precise directional control.', 'Dedicated Share Button: Seamlessly capture and share screenshots, recordings, and more.', 'Xbox Wireless & Bluetooth Technology: Connects easily to Xbox consoles, Windows PCs, phones, and tablets.'], 'Carbon Black', 'In Stock', 'Microsoft / Game Controllers')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category4/controller1.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Xbox Wireless Controller</p>
                <div class="price">
                    <p>Microsoft</p>
                    <p>59$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('PlayStation DualSense (Midnight Black)', '69.99$', '../assets/Category4/controller2.png', 'Discover a deeper, highly immersive gaming experience with the innovative PS5 DualSense controller, featuring haptic feedback and dynamic trigger effects.', ['Haptic Feedback: Feel physically responsive feedback to your in-game actions through dual actuators.', 'Adaptive Triggers: Experience varying levels of force and tension as you interact with your gear and environment.', 'Built-in Microphone and Headset Jack: Chat with friends online easily using the integrated mic.', 'Create Button: Record and broadcast your epic gaming moments.'], 'Midnight Black', 'In Stock', 'Sony / Game Controllers')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category4/controller2.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">PlayStation DualSense (Midnight Black)</p>
                <div class="price">
                    <p>Sony</p>
                    <p>69.99$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('Ultimate Wireless Controller (Black)', '49.99$', '../assets/Category4/controller3.png', 'A versatile pro-grade wireless controller featuring Hall Effect joysticks, custom profile switching buttons, and a convenient charging dock.', ['Hall Effect Joysticks: Eliminates stick drift for permanent precision control.', 'Charging Dock Included: Convenient magnetic dock keeps your controller powered and ready.', 'Pro-level Back Buttons: Two paddle buttons on the rear for custom macro assignments.', 'Multi-Platform Compatibility: Supports Windows PC, Steam Deck, Android, and Switch.'], 'Black', 'In Stock', '8BitDo / Game Controllers')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category4/controller4.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Ultimate Wireless (Black)</p>
                <div class="price">
                    <p>8BitDo</p>
                    <p>49.99$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('G7 SE (Volt Black)', '44.99$', '../assets/Category4/controller4.png', 'High-performance wired gaming controller equipped with anti-drift Hall Effect magnetic sensors and laser-etched anti-slip grips.', ['Hall Effect Magnetic Sensors: Delivers stick longevity and absolute anti-drift precision.', 'Swappable Faceplates: Easily customize your controller look with magnetic faceplates.', 'On-The-Fly Quick Controls: Easily adjust audio volume and mute microphone directly.', 'Dedicated Software Support: Customize trigger deadzones and vibration via Nexus app.'], 'Volt Black', 'In Stock', 'GameSir / Game Controllers')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category4/controller4.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">G7 SE (Volt Black)</p>
                <div class="price">
                    <p>GameSir</p>
                    <p>4499$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('Wolverine V2 Pro Wireless Gaming Controller', '249.99$', '../assets/Category4/controller5.png', 'An elite wireless esports controller featuring Razer Mecha-Tactile action buttons, 6 remappable multi-function buttons, and HyperSpeed wireless.', ['Razer Mecha-Tactile Action Buttons: Combines a soft cushioned touch with tactile microswitch feedback.', '6 Remappable Multi-Function Buttons: 4 extra triggers and 2 top bumpers for custom layouts.', 'Razer HyperSpeed Wireless: Ultra-low latency 2.4GHz connection via USB dongle.', 'Interchangeable Thumbstick Caps: Tailor thumbstick height and shape to your playstyle.'], 'Matte Black', 'In Stock', 'Razer / Game Controllers')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category4/controller5.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Wolverine V2 Pro</p>
                <div class="price">
                    <p>Razer</p>
                    <p>249.99$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('F310 Gamepad', '19.99$', '../assets/Category4/controller6.png', 'Familiar console-like layout gamepad offering broad game support with easy plug-and-play USB connectivity for PC gaming.', ['Broad Game Support: Works seamlessly with hit titles and old-school classics alike.', 'Familiar Button Layout: Traditional dual analog sticks and standard action cluster.', '1.8-Meter Cable: Comfortable cord length for desktop setups without tangling.', 'Programmable Software: Customize buttons and controls using Logitech Profiler software.'], 'Midnight Blue / Grey', 'In Stock', 'Logitech / Game Controllers')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category4/controller6.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">F310 Gamepad</p>
                <div class="price">
                    <p>Logitech</p>
                    <p>19.99$</p>
                </div>
            </div>
        </div>
    </div>

    <dialog id="product-detail-dialog">
        <button class="close-detail-btn" onclick="closeDetail()">&times;</button>
        <div class="detail-container">
            <div class="detail-left">
                <img id="detail-image" alt="Product Image">
            </div>
            <div class="detail-right">
                <h2 id="detail-title"></h2>
                <p id="detail-desc"></p>
                <ul id="detail-specs"></ul>
                <div class="detail-price" id="detail-price"></div>
                <div class="detail-meta">Color : <span id="detail-color" style="color: #111; font-weight: normal;"></span></div>
                <div class="detail-meta">Availability : <span class="in-stock" id="detail-stock"></span></div>
                <div class="detail-category" id="detail-category"></div>
            </div>
        </div>
    </dialog>

    <script>
        const dialog = document.getElementById('product-detail-dialog')
        const detailImg = document.getElementById('detail-image')
        const detailTitle = document.getElementById('detail-title')
        const detailDesc = document.getElementById('detail-desc')
        const detailSpecs = document.getElementById('detail-specs')
        const detailPrice = document.getElementById('detail-price')
        const detailColor = document.getElementById('detail-color')
        const detailStock = document.getElementById('detail-stock')
        const detailCategory = document.getElementById('detail-category')

        function openDetail(title, price, imgSrc, description, specsArray, color, stock, category) {
            detailTitle.textContent = title;
            detailPrice.textContent = price;
            detailImg.src = imgSrc;
            detailDesc.textContent = description;
            detailColor.textContent = color;
            detailCategory.textContent = category;
            detailStock.textContent = stock;

            detailSpecs.innerHTML = '';
            specsArray.forEach(spec => {
                const li = document.createElement('li');
                li.textContent = spec;
                detailSpecs.appendChild(li);
            });

            dialog.showModal();
        }
        function closeDetail() {
            dialog.close();
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('product-detail-dialog').addEventListener('click', function(event) {
                if(event.target === this) {
                    closeDetail()
                }
            })
        })
    </script>
</body>
</html>
