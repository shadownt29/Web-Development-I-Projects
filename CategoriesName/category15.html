                    <p>Attack Shark</p>
                    <p>99.99$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('X11 Wireless Gaming Mouse with Dock', '29.99$', '../assets/Brand3/mouse3.png', 'Ergonomic tri-mode gaming mouse bundled with an RGB magnetic charging dock and customized macro software tuning.', ['Magnetic Charging Base: RGB illuminated charging station keeps mouse ready for action.', 'PAW3311 Gaming Sensor: Up to 22,000 DPI sensitivity adjustments on the fly.', 'Tri-Mode Wireless Connectivity: Seamlessly switch between 2.4G, Bluetooth, and Wired.', 'Huano Micro Switches: Crisp tactile response tuned for fast gaming clicks.'], 'Black', 'In Stock', 'Attack Shark / Gaming Mice')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Brand3/mouse3.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">X11</p>
                <div class="price">
                    <p>Attack Shark</p>
                    <p>29.99$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('X6 Wireless Gaming Mouse', '34.99$', '../assets/Brand3/mouse4.png', 'Ultralight gaming mouse with magnetic RGB charging base, high-grade optical tracking, and ergonomic palm contouring.', ['Included RGB Charging Stand: Simple drop-and-charge desktop convenience.', 'High-Precision Optical Sensor: Up to 26,000 DPI for smooth aiming accuracy.', 'Tri-Mode Connectivity Options: Reliable 2.4GHz wireless connection plus Bluetooth.', 'Lightweight Ergonomic Design: Comfortably supports claw and palm grip styles.'], 'White', 'In Stock', 'Alpha / Gaming Mice')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Brand3/mouse4.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">X6</p>
                <div class="price">
                    <p>Alpha</p>
                    <p>34.99$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('R1 Ultra-Lightweight Wireless Mouse', '24.99$', '../assets/Brand3/mouse5.png', 'Budget-friendly 59g ultralight wireless gaming mouse featuring PAW3311 sensor and ergonomic right-handed shape.', ['Featherlight 59g Shell: Lightweight construction reduces wrist fatigue during long gaming sessions.', 'PAW3311 Optical Sensor: 18,000 DPI resolution for precise tracking control.', 'Tri-Mode Connections: 2.4GHz wireless dongle, Bluetooth 5.2, and USB-C cable.', 'Long Battery Endurance: Up to 65 hours of continuous performance on a single charge.'], 'Black', 'In Stock', 'Attack Shark / Gaming Mice')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Brand3/mouse5.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">R1</p>
                <div class="price">
                    <p>Attack Shark</p>
                    <p>24.99$</p>

            </div>

        <div class="product-card-link" onclick="openDetail('R2 Magnesium Alloy Wireless Mouse', '88.99$', '../assets/Brand3/mouse6.png', 'Esports-grade magnesium metal alloy wireless mouse with 8K polling rate support and high-precision optical tracking.', ['Magnesium Alloy Skeleton Shell: Ultra-rigid metallic build with minimal weight.', '8K Hz Polling Rate Supported: Extreme responsiveness for competitive FPS gaming.', 'PAW3395 Sensor Engine: Pixel-perfect tracking up to 26,000 DPI.', 'Omron Optical Switches: Instant click response without double-clicking issues.'], 'White / Silver', 'In Stock', 'Attack Shark / Gaming Mice')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Brand3/mouse6.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">R2 Magnesium</p>
                <div class="price">
                    <p>Attack Shark</p>
                    <p>88.99$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('X2 Pro Transparent Wireless Mouse', '29.99$', '../assets/Brand3/mouse7.png', 'Unique cyber-themed transparent shell wireless gaming mouse equipped with customizable RGB lighting and high-DPI tracking.', ['Transparent Cyber Shell: Clear casing exposes inner circuitry with dynamic RGB underglow.', 'High-Precision Optical Sensor: Adjustable DPI levels up to 24,000 DPI.', 'Tri-Mode Connection: Bluetooth, 2.4GHz wireless, and Type-C wired connectivity.', 'Silent Click Switches: Low-noise actuation switches ideal for quiet environments.'], 'Clear / RGB', 'In Stock', 'Attack Shark / Gaming Mice')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Brand3/mouse7.png" alt="Product 1">
                </div>

                </div>
            </div>
        </div>
    </div>

    <dialog id="product-detail-dialog">
        <button class="close-detail-btn" onclick="closeDetail()">&times;</button>
        <div class="detail-container">
            <div class="detail-left">
                <img id="detail-image" alt="Product Image">
            </div>
            <div class="detail-right">
                <h2 id="detail-title"></h2>
                <p id="detail-desc"></p>
                <ul id="detail-specs"></ul>
                <div class="detail-price" id="detail-price"></div>
                <div class="detail-meta">Color : <span id="detail-color" style="color: #111; font-weight: normal;"></span></div>
                <div class="detail-meta">Availability : <span class="in-stock" id="detail-stock"></span></div>
                <div class="detail-category" id="detail-category"></div>
            </div>
        </div>
    </dialog>

    <script>
        const dialog = document.getElementById('product-detail-dialog')
        const detailImg = document.getElementById('detail-image')
        const detailTitle = document.getElementById('detail-title')
        const detailDesc = document.getElementById('detail-desc')
        const detailSpecs = document.getElementById('detail-specs')
        const detailPrice = document.getElementById('detail-price')
        const detailColor = document.getElementById('detail-color')
        const detailStock = document.getElementById('detail-stock')
        const detailCategory = document.getElementById('detail-category')

        function openDetail(title, price, imgSrc, description, specsArray, color, stock, category) {
            detailTitle.textContent = title;
            detailPrice.textContent = price;
            detailImg.src = imgSrc;
            detailDesc.textContent = description;
            detailColor.textContent = color;
            detailCategory.textContent = category;
            detailStock.textContent = stock;

            detailSpecs.innerHTML = '';
            specsArray.forEach(spec => {
                const li = document.createElement('li');
                li.textContent = spec;
                detailSpecs.appendChild(li);
            });

            dialog.showModal();
        }
        function closeDetail() {
            dialog.close();
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('product-detail-dialog').addEventListener('click', function(event) {
                if(event.target === this) {
                    closeDetail()
                }
            })
        })
    </script>
</body>
</html>
