<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha</title>
    <link rel="stylesheet" href="category.css">
</head>
<body>
    <h3>PC Cases</h3>
    <div class="brand-products">
        <div class="product-card-link" onclick="openDetail('Y70 Touch Infinite (Exact Match)', '379.99$', '../assets/Category17/case1.png', 'Modern aesthetic dual-chamber ATX case featuring an integrated 14.5-inch multi-touch screen display for system telemetry and interactive widgets.', ['14.5-Inch Integrated Touchscreen: High-resolution multi-touch display for real-time monitoring and custom visuals.', '3-Slot Vertical GPU Mounting: Included PCIe 4.0 riser cable showcases your graphics card front and center.', 'Dual-Chamber Layout: Isolates power supply and cable routing for clean aesthetic cable management.', 'Panoramic Tempered Glass: Seamless corner glass panel provides an unobstructed view of internal hardware.'], 'Snow White / Black', 'In Stock', 'HYTE / PC Cases')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category17/case1.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Y70 Touch Infinite (Exact Match)</p>
                <div class="price">
                    <p>HYTE</p>
                    <p>379.99$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('O11 Dynamic EVO RGB', '169.99$', '../assets/Category17/case2.png', 'Iconic dual-chamber modular ATX case featuring customizable top and bottom L-shaped ARGB light strips and reversible chassis orientation.', ['Dual L-Shaped ARGB Light Strips: Integrated diffused lighting along top and bottom chassis edges.', 'Reversible Chassis Orientation: Convertible structure allows left or right desktop placement layout.', 'Toolless Tempered Glass Panels: Easy snap-in side and front glass removal for hassle-free maintenance.', 'Flexible Cooling Compatibility: Supports up to three 360mm radiators simultaneously.'], 'Black', 'In Stock', 'Lian Li / PC Cases')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category17/case2.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">O11 Dynamic EVO RGB</p>
                <div class="price">
                    <p>Lian Li</p>
                    <p>169.99$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('Y60 Snow White', '199.99$', '../assets/Category17/case3.png', 'Distinctive 3-piece panoramic tempered glass PC case designed for vertical GPU mounting and clean all-white showcase builds.', ['3-Piece Panoramic Glass: Curved visual corner view highlights internal components cleanly.', 'Included PCIe 4.0 Riser Cable: Pre-installed matching color canopy cable for vertical GPU placement.', 'Cold Floor Cooling Duct: Dedicated bottom intake fan ventilation directs airflow straight into GPU fans.', 'All-White Snow Aesthetic: White interior, exterior, grommets, and cabling pass-throughs.'], 'Snow White', 'In Stock', 'Lian Li / PC Cases')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category17/case3.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Y60 Snow White</p>
                <div class="price">
                    <p>Lian Li</p>
                    <p>199.99$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('NV5 White', '99.99$', '../assets/Category17/case4.png', 'Mid-tower showcase chassis with seamless glass panels, integrated D-RGB motherboard surround lighting, and optimized radiator clearance.', ['Seamless Glass Panels: Pillarless front and side glass panel design for full hardware visibility.', 'Integrated D-RGB Lighting Accent: Built-in addressable RGB light strip surrounding PSU shroud.', 'High-Density Mesh Covers: Provides high ventilation while keeping dust out of main chamber.', 'Spacious Interior Layout: Comfortably supports long graphics cards and top 360mm liquid coolers.'], 'Matte White', 'In Stock', 'Phanteks / PC Cases')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category17/case4.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">NV5 White</p>
                <div class="price">
                    <p>Phanteks</p>
                    <p>99.99$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('Y40 Panoramic Glass Chassis', '149.99$', '../assets/Category17/case5.png', 'Sleek SFF-inspired ATX case engineered to showcase vertical graphics cards with 2-piece panoramic glass and upgraded thermal management.', ['2-Piece Panoramic Tempered Glass: Clean corner display showcasing interior build design.', 'Vertical GPU Centric Architecture: Designed exclusively to house large 4-slot graphics cards vertically.', 'Included PCIe 4.0 Luxury Riser Cable: Heavy-duty riser cable matched to case color aesthetics.', 'Optimized High-Flow Intake: Floor cooling intake channels draw fresh air directly upward.'], 'Black / Red', 'In Stock', 'HYTE / PC Cases')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category17/case5.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Phanteks</p>
                <div class="price">
                    <p>HYTE</p>
                    <p>149.99$</p>
                </div>
            </div>
        </div>
    </div>

    <dialog id="product-detail-dialog">
        <button class="close-detail-btn" onclick="closeDetail()">&times;</button>
        <div class="detail-container">
            <div class="detail-left">
                <img id="detail-image" alt="Product Image">
            </div>
            <div class="detail-right">
                <h2 id="detail-title"></h2>
                <p id="detail-desc"></p>
                <ul id="detail-specs"></ul>
                <div class="detail-price" id="detail-price"></div>
                <div class="detail-meta">Color : <span id="detail-color" style="color: #111; font-weight: normal;"></span></div>
                <div class="detail-meta">Availability : <span class="in-stock" id="detail-stock"></span></div>
                <div class="detail-category" id="detail-category"></div>
            </div>
        </div>
    </dialog>

    <script>
        const dialog = document.getElementById('product-detail-dialog')
        const detailImg = document.getElementById('detail-image')
        const detailTitle = document.getElementById('detail-title')
        const detailDesc = document.getElementById('detail-desc')
        const detailSpecs = document.getElementById('detail-specs')
        const detailPrice = document.getElementById('detail-price')
        const detailColor = document.getElementById('detail-color')
        const detailStock = document.getElementById('detail-stock')
        const detailCategory = document.getElementById('detail-category')

        function openDetail(title, price, imgSrc, description, specsArray, color, stock, category) {
            detailTitle.textContent = title;
            detailPrice.textContent = price;
            detailImg.src = imgSrc;
            detailDesc.textContent = description;
            detailColor.textContent = color;
            detailCategory.textContent = category;
            detailStock.textContent = stock;

            detailSpecs.innerHTML = '';
            specsArray.forEach(spec => {
                const li = document.createElement('li');
                li.textContent = spec;
                detailSpecs.appendChild(li);
            });

            dialog.showModal();
        }
        function closeDetail() {
            dialog.close();
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('product-detail-dialog').addEventListener('click', function(event) {
                if(event.target === this) {
                    closeDetail()
                }
            })
        })
    </script>
</body>
</html>
