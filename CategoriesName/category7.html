<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha</title>
    <link rel="stylesheet" href="category.css">
</head>
<body>
    <h3>Disks</h3>
    <div class="brand-products">
    <div class="product-card-link" onclick="openDetail('Ultra Dual Drive Go USB Type-C (Exact Match)', '15.99$', '../assets/Category7/Disk1.png', 'Versatile 2-in-1 flash drive featuring both USB Type-C and Type-A connectors for seamless file transfer across smartphones, tablets, and computers.', ['2-in-1 Dual Connectors: Swivel design featuring both USB Type-C and Type-A plugs.', 'High-Speed USB 3.1 Gen 1 Performance: Transfer speeds up to 150MB/s save time moving files.', 'Automatic Backup: Automatically backs up photos, videos, and contacts via SanDisk Memory Zone app.', 'Swivel Design & Keyring Hole: Protects connectors and attaches easily to keychains.'], 'Black / Silver', 'In Stock', 'SanDisk / Flash Drives')">
        <div class="product-image">
            <div class="image-wrapper">
                <img src="../assets/Category7/Disk1.png" alt="Product 1">
            </div>
            <div class="border-bottom"></div>
            <p class="brandName">Ultra Dual Drive Go USB Type-C (Exact Match)</p>
            <div class="price">
                <p>SanDisk</p>
                <p>15.99$</p>
            </div>
        </div>
    </div>
    <div class="product-card-link" onclick="openDetail('iXpand Flash Drive Go', '29.99$', '../assets/Category7/Disk2.png', 'Designed specifically for iPhone and iPad users, allowing effortless memory expansion and direct video recording to the drive.', ['Dual Lightning and USB-A Connectors: Move content seamlessly between iPhone, iPad, and PC.', 'Automatic Photo & Video Backup: Easily clear space on your iOS device.', 'Password Protection: Protect your files across computers using built-in encryption.', 'Swivel Cap with Keyring Loop: Keeps connectors safe and accessible on the go.'], 'Silver / Black', 'In Stock', 'SanDisk / Flash Drives')">
        <div class="product-image">
            <div class="image-wrapper">
                <img src="../assets/Category7/Disk2.png" alt="Product 1">
            </div>
            <div class="border-bottom"></div>
            <p class="brandName">iXpand Flash Drive Go</p>
            <div class="price">
                <p>Sandisk</p>
                <p>29.99$</p>
            </div>
        </div>
    </div>
    <div class="product-card-link" onclick="openDetail('Ultra USB 3.0', '9.99$', '../assets/Category7/Disk3.png', 'Compact and reliable USB 3.0 flash drive offering fast file transfer speeds and secure data protection in a sleek retractable casing.', ['USB 3.0 Performance: Transfer full-length movies up to 10x faster than standard USB 2.0 drives.', 'Retractable Slider Design: Keeps the USB connector safe from damage when not in use.', 'SanDisk SecureAccess Software: Password-protect private files with 128-bit AES encryption.', 'Lightweight & Portable: Fits easily in pockets, bags, or on keychains.'], 'Black', 'In Stock', 'SanDisk / Flash Drives')">
        <div class="product-image">
            <div class="image-wrapper">
                <img src="../assets/Category7/Disk3.png" alt="Product 1">
            </div>
            <div class="border-bottom"></div>
            <p class="brandName">Ultra USB 3.0</p>
            <div class="price">
                <p>SanDisk</p>
                <p>9.99$</p>
            </div>
        </div>
    </div>
    <div class="product-card-link" onclick="openDetail('Extreme PRO USB 3.2 Solid State Flash Drive', '49.99$', '../assets/Category7/Disk4.png', 'Delivers blazing solid-state performance in a ultra-portable flash drive form factor, engineered for heavy data transfers and high reliability.', ['SSD-Level Performance: Blazing read speeds up to 420MB/s and write speeds up to 380MB/s.', 'Durable Aluminum Metal Casing: Premium metal finish protects against daily wear and tear.', 'RescuePRO Deluxe Software: Free downloadable software for easy deleted file recovery.', 'Backward Compatibility: Plugs into any USB 2.0 or USB 3.0 port seamlessly.'], 'Dark Grey Metal', 'In Stock', 'SanDisk / Flash Drives')">
        <div class="product-image">
            <div class="image-wrapper">
                <img src="../assets/Category7/Disk4.png" alt="Product 1">
            </div>
            <div class="border-bottom"></div>
            <p class="brandName">Extreme PRO USB 3.2 Solid State Flash Drive</p>
            <div class="price">
                <p>SanDisk</p>
                <p>49.99$</p>
            </div>
        </div>
    </div>
    <div class="product-card-link" onclick="openDetail('Cruzer Blade', '7.99$', '../assets/Category7/Disk5.png', 'An ultra-compact, ultra-portable USB flash drive providing dependable storage for photos, music, and documents on the move.', ['Compact Low-Profile Design: Featherlight design fits easily into any key ring or pocket.', 'Plug-and-Play Storage: Instantly store and back up files without installing drivers.', 'SanDisk SecureAccess Included: Private vault setup with 128-bit AES password encryption.', 'Durable Plastic Body: Reliable casing built to handle everyday use.'], 'Black / Red', 'In Stock', 'SanDisk / Flash Drives')">
        <div class="product-image">
            <div class="image-wrapper">
                <img src="../assets/Category7/Disk5.png" alt="Product 1">
            </div>
            <div class="border-bottom"></div>
            <p class="brandName">Cruzer Blade</p>
            <div class="price">
                <p>SanDisk</p>
                <p>7.99$</p>
            </div>
        </div>
    </div>
</div>

    <dialog id="product-detail-dialog">
        <button class="close-detail-btn" onclick="closeDetail()">&times;</button>
        <div class="detail-container">
            <div class="detail-left">
                <img id="detail-image" alt="Product Image">
            </div>
            <div class="detail-right">
                <h2 id="detail-title"></h2>
                <p id="detail-desc"></p>
                <ul id="detail-specs"></ul>
                <div class="detail-price" id="detail-price"></div>
                <div class="detail-meta">Color : <span id="detail-color" style="color: #111; font-weight: normal;"></span></div>
                <div class="detail-meta">Availability : <span class="in-stock" id="detail-stock"></span></div>
                <div class="detail-category" id="detail-category"></div>
            </div>
        </div>
    </dialog>

    <script>
        const dialog = document.getElementById('product-detail-dialog')
        const detailImg = document.getElementById('detail-image')
        const detailTitle = document.getElementById('detail-title')
        const detailDesc = document.getElementById('detail-desc')
        const detailSpecs = document.getElementById('detail-specs')
        const detailPrice = document.getElementById('detail-price')
        const detailColor = document.getElementById('detail-color')
        const detailStock = document.getElementById('detail-stock')
        const detailCategory = document.getElementById('detail-category')

        function openDetail(title, price, imgSrc, description, specsArray, color, stock, category) {
            detailTitle.textContent = title;
            detailPrice.textContent = price;
            detailImg.src = imgSrc;
            detailDesc.textContent = description;
            detailColor.textContent = color;
            detailCategory.textContent = category;
            detailStock.textContent = stock;

            detailSpecs.innerHTML = '';
            specsArray.forEach(spec => {
                const li = document.createElement('li');
                li.textContent = spec;
                detailSpecs.appendChild(li);
            });

            dialog.showModal();
        }
        function closeDetail() {
            dialog.close();
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('product-detail-dialog').addEventListener('click', function(event) {
                if(event.target === this) {
                    closeDetail()
                }
            })
        })
    </script>
</body>
</html>
