<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha</title>
    <link rel="stylesheet" href="category.css">
</head>
<body>
    <div class="brand-logo">
        <img src="../assets/brands/image1.png" alt="Brand 1">
    </div>
    <h3>Coolers</h3>
    <div class="brand-products">
        <div class="product-card-link" onclick="openDetail('Series One x BiliBili', '59$', '../assets/Category6/cooler1.png', 'Special edition Series One mousepad in collaboration with BiliBili, featuring vibrant anime artwork and smooth gliding micro-weave surface.', ['Premium Micro-Weave Fabric: Low-friction surface engineered for high-speed tracking.', 'Stitched Anti-Fray Edges: Reinforces perimeter to prevent peeling during intense gaming.', 'Non-Slip Rubber Base: Heavy textured rubber grip prevents desk sliding.', 'Vivid Sublimation Print: High-definition BiliBili collaborative design.'], 'Blue / White', 'In Stock', 'Alpha / Mousepads')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category6/cooler1.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Series One x BiliBili</p>
                <div class="price">
                    <p>Alpha</p>
                    <p>59$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('Series One x Blue Bamboo', '65$', '../assets/Category6/cooler2.png', 'Features an elegant oriental blue bamboo art design combined with an ultra-smooth control surface for precise cursor movement.', ['Control-Oriented Surface: Balanced glide and stopping power for tactical shooters.', 'Precision Stitched Edges: Low-profile stitching prevents forearm irritation.', 'Eco-Friendly Rubber Base: Non-slip natural rubber grounding base.', 'Water-Resistant Coating: Protects against accidental liquid spills.'], 'Blue / Bamboo Art', 'In Stock', 'Alpha / Mousepads')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category6/cooler2.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Series One x Blue Bamboo</p>
                <div class="price">
                    <p>Alpha</p>
                    <p>65$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('Series One x Blue Ocean', '59$', '../assets/Category6/cooler3.png', 'Dynamic deep-ocean wave aesthetic paired with a high-density cloth surface for smooth mouse movements and high-DPI tracking.', ['High-Density Cloth Surface: Optimized for optical and laser mouse sensors.', 'Anti-Fray Edge Guard: Ultra-fine stitching extends long-term durability.', 'Heavy-Duty Rubber Base: Holds firm on glass, wood, and metal desks.', 'Generous Desk Surface Footprint: Ample room for low-DPI arm sweeping.'], 'Ocean Blue', 'In Stock', 'Alpha / Mousepads')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category6/cooler3.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Series One x Blue Ocean</p>
                <div class="price">
                    <p>Alpha</p>
                    <p>59$</p>
                </div>
            </div>
        </div>
    </div>

    <dialog id="product-detail-dialog">
        <button class="close-detail-btn" onclick="closeDetail()">&times;</button>
        <div class="detail-container">
            <div class="detail-left">
                <img id="detail-image" alt="Product Image">
            </div>
            <div class="detail-right">
                <h2 id="detail-title"></h2>
                <p id="detail-desc"></p>
                <ul id="detail-specs"></ul>
                <div class="detail-price" id="detail-price"></div>
                <div class="detail-meta">Color : <span id="detail-color" style="color: #111; font-weight: normal;"></span></div>
                <div class="detail-meta">Availability : <span class="in-stock" id="detail-stock"></span></div>
                <div class="detail-category" id="detail-category"></div>
            </div>
        </div>
    </dialog>

    <script>
        const dialog = document.getElementById('product-detail-dialog')
        const detailImg = document.getElementById('detail-image')
        const detailTitle = document.getElementById('detail-title')
        const detailDesc = document.getElementById('detail-desc')
        const detailSpecs = document.getElementById('detail-specs')
        const detailPrice = document.getElementById('detail-price')
        const detailColor = document.getElementById('detail-color')
        const detailStock = document.getElementById('detail-stock')
        const detailCategory = document.getElementById('detail-category')

        function openDetail(title, price, imgSrc, description, specsArray, color, stock, category) {
            detailTitle.textContent = title;
            detailPrice.textContent = price;
            detailImg.src = imgSrc;
            detailDesc.textContent = description;
            detailColor.textContent = color;
            detailCategory.textContent = category;
            detailStock.textContent = stock;

            detailSpecs.innerHTML = '';
            specsArray.forEach(spec => {
                const li = document.createElement('li');
                li.textContent = spec;
                detailSpecs.appendChild(li);
            });

            dialog.showModal();
        }
        function closeDetail() {
            dialog.close();
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('product-detail-dialog').addEventListener('click', function(event) {
                if(event.target === this) {
                    closeDetail()
                }
            })
        })
    </script>
</body>
</html>
