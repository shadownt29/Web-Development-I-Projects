<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha</title>
    <link rel="stylesheet" href="category.css">
</head>
<body>
    <h3>Microphones</h3>
    <div class="brand-products">
        <div class="product-card-link" onclick="openDetail('MV7+', '279$', '../assets/Category13/microphone1.png', 'Hybrid XLR/USB dynamic microphone engineered for podcasting, streaming, and vocal recording with customizable LED touch panel and onboard DSP audio processing.', ['Dual USB-C and XLR Outputs: Flexible connectivity for direct PC recording or professional audio interfaces.', 'Customizable LED Touch Panel: Tap-to-mute interface with configurable color display gradients.', 'Digital Signal Processing (DSP): Includes Auto Level Mode, Digital Popper Stopper, and Real-Time Denoiser.', 'Voice Isolation Technology: Focuses speech isolation to eliminate unwanted room background noise.'], 'Black', 'In Stock', 'Shure / Microphones')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category13/microphone1.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">MV7+</p>
                <div class="price">
                    <p>Shure</p>
                    <p>279$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('QuadCast S', '159$', '../assets/Category13/microphone2.png', 'Feature-packed USB condenser microphone designed for streamers and content creators with vibrant RGB lighting and built-in anti-vibration shock mount.', ['Dynamic RGB Lighting Effects: Customizable dual-zone RGB backlighting via HyperX NGENUITY software.', 'Built-In Anti-Vibration Shock Mount: Isolates the mic from desk rumbles and mechanical thumps.', 'Tap-to-Mute Sensor with LED Indicator: Prevents audio accidents with quick-touch mute control.', '4 Selectable Polar Patterns: Switch between Stereo, Omnidirectional, Cardioid, and Bidirectional.'], 'Black / RGB', 'In Stock', 'HyperX / Microphones')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category13/microphone2.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">QuadCast S</p>
                <div class="price">
                    <p>HyperX</p>
                    <p>159$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('Seiren V3 Chroma', '129$', '../assets/Category13/microphone3.png', 'Feature-rich RGB USB condenser microphone equipped with multi-function tap sensor and advanced audio gain customization.', ['360-Degree Chroma RGB Lighting: Syncs seamlessly with Razer Chroma RGB ecosystem games and setups.', 'Multi-Function Tap-to-Mute Sensor: Intuitive touch controls for muting, gain tuning, and lighting toggle.', 'Supercardioid Condenser Capsule: Tight pickup angle suppresses ambient background typing and mouse clicks.', 'Digital Gain Limiter: Automatically prevents voice distortion and clipping during intense streams.'], 'Black', 'In Stock', 'Razer / Microphones')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category13/microphone3.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Seiren V3 Chroma</p>
                <div class="price">
                    <p>Razer</p>
                    <p>129$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('G Yeti GX', '149$', '../assets/Category13/microphone5.png', 'Premium broadcast-style dynamic USB gaming microphone powered by LIGHTSYNC RGB and Blue VO!CE audio processing.', ['Custom-Tuned Dynamic Capsule: Rejects background fan noise and keyboard clicks for vocal clarity.', 'LIGHTSYNC RGB Lighting: Dual-zone customizable RGB light ring synced via Logitech G HUB.', 'Smart Audio Lock: Analog limiter adjusts gain automatically to prevent clipping.', 'Blue VO!CE Broadcast Filters: Real-time voice enhancement software filters and vocal presets.'], 'Black', 'In Stock', 'Logitech / Microphones')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category13/microphone5.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">G Yeti GX</p>
                <div class="price">
                    <p>Logitech</p>
                    <p>149$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('Alias', '179$', '../assets/Category13/microphone6.png', 'Designed specifically for gaming and streaming, featuring a massive condenser capsule, 5-stage LED peak level indicator, and Sonar software.', ['1-Inch Custom Condenser Capsule: Captures rich, detailed vocal acoustics three times larger than average mics.', 'LED Level Indicator & Mute Display: Real-time volume level monitoring and mute status built right on the front.', 'Shock-Absorbing Desktop Stand: Reduces unwanted desk vibrations and bump noises.', 'SteelSeries Sonar Software Integration: Professional multi-channel audio mixing and AI noise cancellation.'], 'Black', 'In Stock', 'SteelSeries / Microphones')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category13/microphone6.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Alias</p>
                <div class="price">
                    <p>SteelSeries</p>
                    <p>179$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('AT2020USB+', '129$', '../assets/Category13/microphone7.png', 'Legendary studio-quality USB condenser microphone providing articulate, crystal-clear audio reproduction for music recording and voiceovers.', ['Studio-Quality Condenser Capsule: High-grade A/D converter with 16-bit, 44.1/48 kHz sampling rate.', 'Built-In Headphone Jack with Volume Control: Direct zero-latency monitoring of your voice signals.', 'Mix Control Dial: Blends microphone audio with pre-recorded computer audio for seamless tracking.', 'Cardioid Polar Pattern: Reduces pickup of side and rear sounds for improved vocal isolation.'], 'Black', 'In Stock', 'Audio-Technica / Microphones')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category13/microphone7.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">AT2020USB+</p>
                <div class="price">
                    <p>Audio-Technica</p>
                    <p>129$</p>
                </div>
            </div>
        </div>
    </div>

    <dialog id="product-detail-dialog">
        <button class="close-detail-btn" onclick="closeDetail()">&times;</button>
        <div class="detail-container">
            <div class="detail-left">
                <img id="detail-image" alt="Product Image">
            </div>
            <div class="detail-right">
                <h2 id="detail-title"></h2>
                <p id="detail-desc"></p>
                <ul id="detail-specs"></ul>
                <div class="detail-price" id="detail-price"></div>
                <div class="detail-meta">Color : <span id="detail-color" style="color: #111; font-weight: normal;"></span></div>
                <div class="detail-meta">Availability : <span class="in-stock" id="detail-stock"></span></div>
                <div class="detail-category" id="detail-category"></div>
            </div>
        </div>
    </dialog>

    <script>
        const dialog = document.getElementById('product-detail-dialog')
        const detailImg = document.getElementById('detail-image')
        const detailTitle = document.getElementById('detail-title')
        const detailDesc = document.getElementById('detail-desc')
        const detailSpecs = document.getElementById('detail-specs')
        const detailPrice = document.getElementById('detail-price')
        const detailColor = document.getElementById('detail-color')
        const detailStock = document.getElementById('detail-stock')
        const detailCategory = document.getElementById('detail-category')

        function openDetail(title, price, imgSrc, description, specsArray, color, stock, category) {
            detailTitle.textContent = title;
            detailPrice.textContent = price;
            detailImg.src = imgSrc;
            detailDesc.textContent = description;
            detailColor.textContent = color;
            detailCategory.textContent = category;
            detailStock.textContent = stock;

            detailSpecs.innerHTML = '';
            specsArray.forEach(spec => {
                const li = document.createElement('li');
                li.textContent = spec;
                detailSpecs.appendChild(li);
            });

            dialog.showModal();
        }
        function closeDetail() {
            dialog.close();
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('product-detail-dialog').addEventListener('click', function(event) {
                if(event.target === this) {
                    closeDetail()
                }
            })
        })
    </script>
</body>
</html>
