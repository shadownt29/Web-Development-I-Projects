<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha</title>
    <link rel="stylesheet" href="category.css">
</head>
<body>
    <h3>SFX Power Supply</h3>
    <div class="brand-products">
        <div class="product-card-link" onclick="openDetail('Dagger PM 1200W (Exact Match)', '239.99$', '../assets/Category18/fan1.png', 'High-density SFX-L power supply delivering up to 1200W of power with 80 PLUS Platinum efficiency and full ATX 3.0 / PCIe 5.0 compatibility.', ['1200W Power Output: Massive wattage capability engineered into a compact SFX-L form factor.', '80 PLUS Platinum Efficiency: Reduces energy waste and heat dissipation during heavy workloads.', 'ATX 3.0 & PCIe 5.0 Ready: Features native 12VHPWR 16-pin cable for modern high-draw GPUs.', 'Fully Modular Ribbon Cables: Simplifies cable management in small form factor PC builds.'], 'Black', 'In Stock', 'FSP / Power Supplies')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category18/fan1.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Dagger PM 1200W (Exact Match)</p>
                <div class="price">
                    <p>FSP</p>
                    <p>239.99$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('SF1000L 1000W Fully Modular Power Supply', '199.99$', '../assets/Category18/fan2.png', 'Compact SFX-L power supply offering 1000W continuous output, 80 PLUS Gold certification, and quiet 120mm PWM fan operation.', ['1000W Continuous Power: Delivers stable wattage for small form factor gaming rigs.', '80 PLUS Gold Certified: High efficiency power conversion under varying load conditions.', '120mm Rifle Bearing Fan: Zero RPM fan mode for silent operation at low to medium loads.', 'Micro-Fit Fully Modular Cables: Flexible, high-density cables tailored for tight chassis clearance.'], 'Black', 'In Stock', 'Corsair / Power Supplies')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category18/fan2.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">SF1000L 1000W</p>
                <div class="price">
                    <p>Corsair</p>
                    <p>199.99$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('ROG Loki SFX-L 1000W Platinum', '249.99$', '../assets/Category18/fan3.png', 'Enthusiast SFX-L power supply featuring ROG heatsinks, 80 PLUS Platinum efficiency, ARGB fan, and native PCIe 5.0 support.', ['ROG Heatsinks: Covers critical components to lower temperatures and extend operational lifespan.', '80 PLUS Platinum Certified: Ultra-efficient power delivery with lower noise and thermal output.', '120mm ARGB Fan: Integrated Aura Sync RGB lighting compatible with motherboard sync.', 'PCIe Gen 5.0 Ready: Bundled 16-pin 12VHPWR cable supplies up to 600W directly to GPU.'], 'Black / Silver', 'In Stock', 'Asus / Power Supplies')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category18/fan3.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">ROG Loki SFX-L 1000W Platinum</p>
                <div class="price">
                    <p>Asus</p>
                    <p>249.99$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('SP850 850W SFX Power Supply', '149.99$', '../assets/Category18/fan4.png', 'Performance 850W SFX power supply featuring sleek aluminum housing, 80 PLUS Gold certification, and Japanese electrolytic capacitors.', ['Sleek Brushed Aluminum Housing: Premium exterior casing matches modern aluminum SFF chassis.', '80 PLUS Gold Efficiency: Ensures up to 90% power conversion efficiency under typical loads.', '100% Japanese Capacitors: Exceptional electrical stability and long-term hardware durability.', 'Zero RPM Mode: 92mm hydraulic bearing fan stays completely silent below 40% workload.'], 'Black', 'In Stock', 'Lian Li / Power Supplies')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category18/fan4.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">SP850 850W</p>
                <div class="price">
                    <p>Lian Li</p>
                    <p>149.99$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('Master V1100 SFX Platinum', '249.99$', '../assets/Category18/fan5.png', 'Flagship 1100W power supply in a true mini SFX form factor, engineered for high-power small form factor gaming systems.', ['True SFX Form Factor: Delivers massive 1100W output without expanding to SFX-L size.', '80 PLUS Platinum Certified: Maximizes energy efficiency while keeping heat build-up low.', 'Full-Bridge LLC & DC-to-DC Design: Delivers stable voltage regulation and minimal ripple noise.', 'Fully Modular Cabling: Heavy-duty flexible cables facilitate clean SFF routing.'], 'Black', 'In Stock', 'Cooler Master / Power Supplies')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category18/fan5.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Master V1100 SFX Platinum</p>
                <div class="price">
                    <p>Cooler</p>
                    <p>249.99$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('SX1000 Platinum SFX-L Power Supply', '259.99$', '../assets/Category18/fan6.png', 'High-density 1000W SFX-L power supply featuring 80 PLUS Platinum rating, flexible flat cables, and dual ball bearing fan.', ['1000W Continuous Output: Engineered for demanding multi-core CPUs and top-tier GPUs.', '80 PLUS Platinum Efficiency: Reduces operational power loss and operating temperatures.', 'Dual Ball Bearing 120mm Fan: Provides long-lasting cooling reliability with silent acoustics.', 'All-Flexible Flat Cables: Easy bending and routing through narrow chassis cable channels.'], 'Black', 'In Stock', 'SilverStone / Power Supplies')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/Category18/fan6.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">SX1000 Platinum</p>
                <div class="price">
                    <p>SilverStone</p>
                    <p>259.99$</p>
                </div>
            </div>
        </div>
    </div>

    <dialog id="product-detail-dialog">
        <button class="close-detail-btn" onclick="closeDetail()">&times;</button>
        <div class="detail-container">
            <div class="detail-left">
                <img id="detail-image" alt="Product Image">
            </div>
            <div class="detail-right">
                <h2 id="detail-title"></h2>
                <p id="detail-desc"></p>
                <ul id="detail-specs"></ul>
                <div class="detail-price" id="detail-price"></div>
                <div class="detail-meta">Color : <span id="detail-color" style="color: #111; font-weight: normal;"></span></div>
                <div class="detail-meta">Availability : <span class="in-stock" id="detail-stock"></span></div>
                <div class="detail-category" id="detail-category"></div>
            </div>
        </div>
    </dialog>

    <script>
        const dialog = document.getElementById('product-detail-dialog')
        const detailImg = document.getElementById('detail-image')
        const detailTitle = document.getElementById('detail-title')
        const detailDesc = document.getElementById('detail-desc')
        const detailSpecs = document.getElementById('detail-specs')
        const detailPrice = document.getElementById('detail-price')
        const detailColor = document.getElementById('detail-color')
        const detailStock = document.getElementById('detail-stock')
        const detailCategory = document.getElementById('detail-category')

        function openDetail(title, price, imgSrc, description, specsArray, color, stock, category) {
            detailTitle.textContent = title;
            detailPrice.textContent = price;
            detailImg.src = imgSrc;
            detailDesc.textContent = description;
            detailColor.textContent = color;
            detailCategory.textContent = category;
            detailStock.textContent = stock;

            detailSpecs.innerHTML = '';
            specsArray.forEach(spec => {
                const li = document.createElement('li');
                li.textContent = spec;
                detailSpecs.appendChild(li);
            });

            dialog.showModal();
        }
        function closeDetail() {
            dialog.close();
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('product-detail-dialog').addEventListener('click', function(event) {
                if(event.target === this) {
                    closeDetail()
                }
            })
        })
    </script>
</body>
</html>
