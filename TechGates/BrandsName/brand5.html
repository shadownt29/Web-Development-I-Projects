<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crucial Brand</title>
    <link rel="stylesheet" href="brands.css">
    <link rel="icon" href="../assets/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="brand-logo">
        <img src="../assets/brands_categories/brands/image5.png" alt="Brand 1">
    </div>
    <h3>Rams</h3>
    <div class="brand-products">
        <div class="product-card-link" onclick="openDetail('Pro DDR5 Overclocking (OC) Gaming RAM', '109$', '../assets/brands_categories/Brand5/storage1.png', 'Engineered for extreme performance and high-speed overclocking, the Crucial Pro DDR5 OC memory unlocks massive bandwidth for demanding gaming and creative workflows.', ['Extreme Frequency & Bandwidth: Push your system limits with high-speed DDR5 overclocking profiles.', 'Integrated Power Management IC (PMIC): Improves power stability and efficiency directly on the module.', 'Aluminum Heat Spreader: Low-profile thermal design keeps modules cool under heavy voltage.', 'Intel XMP 3.0 and AMD EXPO Support: Easy one-click profile configuration in BIOS.'], 'Black', 'In Stock', 'Crucial / Storage & RAM')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/brands_categories/Brand5/storage1.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Pro DDR5 Overclocking (OC) Gaming RAM</p>
                <div class="price">
                    <p>Crucial</p>
                    <p>109$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('DDR5 Desktop RAM UDIMM', '89$', '../assets/brands_categories/Brand5/storage2.png', 'Empower your modern desktop setup with lightning-fast DDR5 speeds, enhanced data integrity, and superior multi-tasking capacity.', ['Next-Gen Data Speeds: Substantially faster data transfer rates compared to previous DDR4 generations.', 'On-Die ECC (Error-Correction Code): Maintains data integrity and stability at high speeds.', 'Plug-and-Play Stability: Reliable out-of-the-box speeds with wide motherboard compatibility.', 'Optimized Power Efficiency: Lower operating voltage for reduced energy consumption.'], 'Black / Green PCB', 'In Stock', 'Crucial / Storage & RAM')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/brands_categories/Brand5/storage2.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">DDR5 Desktop RAM UDIMM</p>
                <div class="price">
                    <p>Crucial</p>
                    <p>89$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('Pro DDR4 Desktop RAM', '59$', '../assets/brands_categories/Brand5/storage3.png', 'Reliable, high-performance DDR4 memory designed to breathe new life into standard desktop systems and mainstream productivity builds.', ['Proven Stability & Reliability: Extensively tested across thousands of systems and motherboards.', 'Sleek Minimalist Heat Spreader: Efficient passive cooling without bulky clearance issues.', 'Cost-Effective Upgrade: Instant boost to application responsiveness and multitasking capabilities.', 'Easy Installation: Standard 288-pin UDIMM form factor for quick setup.'], 'Black', 'In Stock', 'Crucial / Storage & RAM')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/brands_categories/Brand5/storage3.png" alt="Product 1">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Pro DDR4 Desktop RAM</p>
                <div class="price">
                    <p>Crucial</p>
                    <p>59$</p>
                </div>
            </div>
        </div>
    </div>

    <dialog id="product-detail-dialog">
        <button class="close-detail-btn" onclick="closeDetail()">&times;</button>
        <div class="detail-container">
            <div class="detail-left">
                <img id="detail-image" alt="Product Image">
            </div>
            <div class="detail-right">
                <h2 id="detail-title"></h2>
                <p id="detail-desc"></p>
                <ul id="detail-specs"></ul>
                <div class="detail-price" id="detail-price"></div>
                <div class="detail-meta">Color : <span id="detail-color" style="color: #111; font-weight: normal;"></span></div>
                <div class="detail-meta">Availability : <span class="in-stock" id="detail-stock"></span></div>
                <div class="detail-category" id="detail-category">Alpha / Keyboards</div>
            </div>
        </div>
    </dialog>

    <script>
        const dialog = document.getElementById('product-detail-dialog')
        const detailImg = document.getElementById('detail-image')
        const detailTitle = document.getElementById('detail-title')
        const detailDesc = document.getElementById('detail-desc')
        const detailSpecs = document.getElementById('detail-specs')
        const detailPrice = document.getElementById('detail-price')
        const detailColor = document.getElementById('detail-color')
        const detailStock = document.getElementById('detail-stock')
        const detailCategory = document.getElementById('detail-category')

        function openDetail(title, price, imgSrc, description, specsArray, color, stock, category) {
            detailTitle.textContent = title;
            detailPrice.textContent = price;
            detailImg.src = imgSrc;
            detailDesc.textContent = description;
            detailColor.textContent = color;
            detailCategory.textContent = category;
            detailStock.textContent = stock;

            detailSpecs.innerHTML = '';
            specsArray.forEach(spec => {
                const li = document.createElement('li');
                li.textContent = spec;
                detailSpecs.appendChild(li);
            });

            dialog.showModal();
        }
        function closeDetail() {
            dialog.close();
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('product-detail-dialog').addEventListener('click', function(event) {
                if(event.target === this) {
                    closeDetail()
                }
            })
        })
    </script>
</body>
</html>
