<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha</title>
    <link rel="stylesheet" href="category.css">
    <link rel="icon" href="../assets/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="brand-logo">
        <img src="../assets/brands_categories/brands/image1.png" alt="Brand 1">
    </div>
    <h3>RAMs</h3>
    <div class="brand-products">
        <div class="product-card-link" onclick="openDetail('Pro DDR5 Overclocking (OC) Gaming RAM', '109$', '../assets/brands_categories/Brand5/storage1.png', 'Crucial Pro DDR5 Overclocking Gaming RAM delivers high-speed performance for gaming, multitasking, and demanding applications. Designed for enthusiasts who want reliable and smooth system performance.',['DDR5 Memory Technology: Next-generation memory technology for faster data transfer.', 'Overclocking Support: Designed for enhanced memory performance.', 'Gaming Performance: Suitable for gaming and demanding applications.', 'High Reliability: Built for stable and efficient desktop performance.'], 'Black', 'In Stock', 'Crucial / Desktop RAM')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/brands_categories/Brand5/storage1.png" alt="Crucial Pro DDR5 Gaming RAM">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Pro DDR5 Overclocking (OC) Gaming RAM</p>
                <div class="price">
                    <p>Crucial</p>
                    <p>109$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('DDR5 Desktop RAM UDIMM', '89$', '../assets/brands_categories/Brand5/storage2.png', 'Crucial DDR5 Desktop RAM UDIMM is designed to improve desktop computer performance, offering faster memory technology for multitasking, productivity, and everyday computing.',[ 'DDR5 Memory Technology: Modern memory architecture for improved performance.', 'UDIMM Design: Standard unbuffered desktop memory module.', 'Multitasking Performance: Helps support multiple applications simultaneously.', 'Desktop Compatibility: Designed for compatible DDR5 desktop motherboards.'],'Green', 'In Stock','Crucial / Desktop RAM')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/brands_categories/Brand5/storage2.png" alt="Crucial DDR5 Desktop RAM">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">DDR5 Desktop RAM UDIMM</p>
                <div class="price">
                    <p>Crucial</p>
                    <p>89$</p>
                </div>
            </div>
        </div>
        <div class="product-card-link" onclick="openDetail('Pro DDR4 Desktop RAM', '59$', '../assets/brands_categories/Brand5/storage3.png', 'Crucial Pro DDR4 Desktop RAM provides dependable performance for desktop computers. It is suitable for everyday computing, multitasking, and gaming with compatible DDR4 systems.',['DDR4 Memory Technology: Reliable memory technology for desktop computers.','Desktop UDIMM: Designed for compatible desktop motherboards.','Smooth Multitasking: Supports everyday applications and workloads.','Reliable Performance: Suitable for home, office, and gaming computers.'],'Black', 'In Stock', 'Crucial / Desktop RAM')">
            <div class="product-image">
                <div class="image-wrapper">
                    <img src="../assets/brands_categories/Brand5/storage3.png" alt="Crucial Pro DDR4 Desktop RAM">
                </div>
                <div class="border-bottom"></div>
                <p class="brandName">Pro DDR4 Desktop RAM</p>
                <div class="price">
                    <p>Crucial</p>
                    <p>59$</p>
                </div>
            </div>
        </div>

    </div>

    <dialog id="product-detail-dialog">
        <button class="close-detail-btn" onclick="closeDetail()">&times;</button>
        <div class="detail-container">
            <div class="detail-left">
                <img id="detail-image" alt="Product Image">
            </div>
            <div class="detail-right">
                <h2 id="detail-title"></h2>
                <p id="detail-desc"></p>
                <ul id="detail-specs"></ul>
                <div class="detail-price" id="detail-price"></div>
                <div class="detail-meta">Color : <span id="detail-color" style="color: #111; font-weight: normal;"></span></div>
                <div class="detail-meta">Availability : <span class="in-stock" id="detail-stock"></span></div>
                <div class="detail-category" id="detail-category"></div>
            </div>
        </div>
    </dialog>

    <script>
        const dialog = document.getElementById('product-detail-dialog')
        const detailImg = document.getElementById('detail-image')
        const detailTitle = document.getElementById('detail-title')
        const detailDesc = document.getElementById('detail-desc')
        const detailSpecs = document.getElementById('detail-specs')
        const detailPrice = document.getElementById('detail-price')
        const detailColor = document.getElementById('detail-color')
        const detailStock = document.getElementById('detail-stock')
        const detailCategory = document.getElementById('detail-category')

        function openDetail(title, price, imgSrc, description, specsArray, color, stock, category) {
            detailTitle.textContent = title;
            detailPrice.textContent = price;
            detailImg.src = imgSrc;
            detailDesc.textContent = description;
            detailColor.textContent = color;
            detailCategory.textContent = category;
            detailStock.textContent = stock;

            detailSpecs.innerHTML = '';
            specsArray.forEach(spec => {
                const li = document.createElement('li');
                li.textContent = spec;
                detailSpecs.appendChild(li);
            });

            dialog.showModal();
        }
        function closeDetail() {
            dialog.close();
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('product-detail-dialog').addEventListener('click', function(event) {
                if(event.target === this) {
                    closeDetail()
                }
            })
        })
    </script>
</body>
</html>
